name: Triage
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
permissions:
  issues: write
jobs:
  label:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            // "### Heading\n\nvalue" → { heading: value }
            const fields = {};
            for (const m of body.matchAll(/^### (.+?)\s*\n+([\s\S]*?)(?=\n### |\s*$)/gm)) {
              fields[m[1].trim().toLowerCase()] = m[2].trim();
            }
            const pick = (...names) => names.map(n => fields[n]).find(Boolean) || '';
            const has = (text, s) => text.toLowerCase().includes(s);
            const labels = new Set();

            const os = pick('os');
            if (has(os, 'windows')) labels.add('os: windows');
            if (has(os, 'macos')) labels.add('os: macos');
            if (has(os, 'linux')) labels.add('os: linux');

            const fmt = pick('plugin format(s)', 'plugin format');
            for (const f of ['vst3', 'clap', 'au', 'standalone'])
              if (fmt.toLowerCase().split(/[,\s]+/).includes(f)) labels.add(`format: ${f}`);

            const area = pick('where does it happen?', 'area') + ' ' + pick('when does it happen?');
            const areaMap = {
              'sound / dsp': 'area: dsp', 'user interface': 'area: ui', 'presets': 'area: presets',
              'modulation': 'area: modulation', 'loading / installing': 'area: install',
              'plugin scan': 'area: install', 'performance': 'area: performance', 'midi': 'area: midi',
            };
            for (const [k, v] of Object.entries(areaMap)) if (has(area, k)) labels.add(v);

            const missing = ['kurv version', 'daw and version'].filter(k => k in fields && /^_no response_$|^$/i.test(fields[k]));
            if (issue.labels.some(l => l.name === 'enhancement')) missing.length = 0;
            if (missing.length) labels.add('needs info');

            if (labels.size) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: [...labels] });
            }
            if (context.payload.action === 'opened') {
              const kind = issue.labels.some(l => l.name === 'crash') ? 'crash report'
                : issue.labels.some(l => l.name === 'enhancement') ? 'request' : 'report';
              const ask = missing.length
                ? `\n\nIt's missing **${missing.join('** and **')}** — please edit the issue and fill those in so we can reproduce it.` : '';
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body:
                `Thanks for the ${kind}. It's been tagged ${[...labels].filter(l => l !== 'needs info').map(l => '`' + l + '`').join(' ') || 'for triage'} and will show up on the [status board](https://github.com/orgs/Matari-Audio/projects/2) once confirmed.${ask}\n\nIf you find more details later, add a comment here rather than opening a new issue.` });
            }

  reporter-replied:
    if: github.event_name == 'issue_comment' && github.event.comment.user.login == github.event.issue.user.login && contains(github.event.issue.labels.*.name, 'needs info')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.removeLabel({ ...context.repo, issue_number: context.payload.issue.number, name: 'needs info' }).catch(() => {});
